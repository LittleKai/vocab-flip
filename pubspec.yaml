name: vocabflip
description: "VocabFlip - Multi-language vocabulary learning flashcard app"
publish_to: 'none'

version: 1.1.7+5

environment:
  sdk: ^3.5.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State Management
  provider: ^6.1.1

  # Database
  sqflite: ^2.4.0
  sqflite_common_ffi: ^2.4.0
  sqlite3_flutter_libs: ^0.5.0
  path: ^1.9.0

  # Network
  http: ^1.2.0
  dio: ^5.4.1

  # UI
  flip_card: ^0.7.0
  fl_chart: ^0.66.2
  shimmer: ^3.0.0
  flutter_rating_bar: ^4.0.1
  infinite_scroll_pagination: ^4.0.0

  # Audio
  flutter_tts: ^3.8.5

  # File handling
  file_picker: ^8.0.0
  share_plus: ^7.2.2
  path_provider: ^2.1.2
  image: ^4.1.3
  archive: ^3.4.9
  excel: ^4.0.6

  # Utils
  uuid: ^4.3.3
  intl: ^0.20.2
  shared_preferences: ^2.2.2
  google_sign_in: ^6.2.1
  flutter_dotenv: ^5.1.0
  package_info_plus: ^8.0.0

  # Google Drive Backup
  googleapis: ^13.0.0
  googleapis_auth: ^1.5.0
  extension_google_sign_in_as_googleapis_auth: ^2.0.0
  url_launcher: ^6.2.5
  flutter_secure_storage: ^10.0.0
  fsrs: ^2.0.1
  curved_labeled_navigation_bar: ^2.0.6
  awesome_dialog: ^3.3.0
  draggable_home: ^1.0.5
  cached_network_image: ^3.4.1
  path_drawing: ^1.0.1
  lpinyin: ^2.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  mockito: ^5.4.4
  sqlite3: ^3.1.4  # For building Chinese dictionary
  yaml: ^3.1.2     # For build_release tool

flutter:
  uses-material-design: true

  # Localization
  generate: true

  assets:
    - assets/chinese_dict.db
    - assets/en_vi_dict.db
    - assets/zh_vi_dict.db
    - assets/ja_vi_dict.db
    - assets/stroke_data.db
    - .env
